<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa Luzia | Distribuidora</title>
  <meta name="description" content="Soluções em nutrição para quem cuida de pessoas.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');
    :root{--blue:#146ff4;--ink:#12203a;--muted:#62708a;--line:#dce6f3;--mist:#f5f9ff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
    .hero{min-height:100vh;overflow:hidden;position:relative;background:linear-gradient(120deg,#fff 0%,#fff 52%,#f4f8ff 100%)}
    .cursor-glow{position:fixed;z-index:1;width:300px;height:300px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(20,111,244,.15),rgba(20,111,244,0) 67%);opacity:0;transition:opacity .3s ease;mix-blend-mode:multiply}.cursor-glow.is-active{opacity:1}.hero:before{content:"";position:absolute;width:650px;height:650px;right:-225px;top:100px;border-radius:50%;background:radial-gradient(circle at 36% 38%,rgba(23,112,244,.18),rgba(23,112,244,0) 68%)}.hero:after{content:"";position:absolute;width:420px;height:420px;left:-260px;bottom:-315px;border:1px solid rgba(20,111,244,.12);border-radius:50%}
    .topbar{height:92px;width:min(1240px,calc(100% - 64px));margin:auto;display:flex;align-items:center;position:sticky;top:0;z-index:4;transition:opacity .48s ease,transform .48s ease}.topbar.is-hidden{opacity:0;transform:translateY(-12px);pointer-events:none}
    .brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);font-family:Manrope,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.06em;line-height:1}.brand img{width:39px;height:39px;object-fit:contain}.brand small{display:block;margin-top:5px;color:#64718a;font:700 7px "DM Sans",sans-serif;letter-spacing:.15em;text-transform:uppercase}
    nav{display:flex;align-items:center;gap:36px;margin:0 auto}nav a{color:#35445e;text-decoration:none;font-size:14px;font-weight:600;transition:color .2s}nav a:hover,nav a:first-child{color:var(--blue)}.menu-note{color:#9aa8bb;font-size:12px;font-weight:600}
    .hero-grid{width:min(1240px,calc(100% - 64px));min-height:calc(100vh - 92px);padding:44px 0 44px;margin:auto;display:grid;grid-template-columns:.86fr 1.14fr;gap:25px;align-items:start;position:relative;z-index:2}
    .eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.19em;text-transform:uppercase;margin:0 0 19px}h1{font:800 clamp(49px,4.8vw,71px)/1.07 Manrope,sans-serif;letter-spacing:-.06em;margin:0;max-width:610px}h1 em{color:var(--blue);font-style:normal}.intro{font-size:17px;line-height:1.7;color:var(--muted);max-width:475px;margin:24px 0 29px}.buttons{display:flex;gap:12px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;min-height:53px;padding:0 25px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:700;transition:transform .2s,box-shadow .2s}.button:hover{transform:translateY(-2px)}.button-primary{background:var(--blue);color:#fff;box-shadow:0 11px 22px rgba(20,111,244,.24)}.button-secondary{background:#fff;color:var(--ink);border:1px solid #b9c8db}
    .proof{display:flex;align-items:center;gap:15px;margin-top:38px;padding-top:21px;border-top:1px solid var(--line)}.proof strong{font:800 25px/1 Manrope,sans-serif;letter-spacing:-.05em;color:var(--blue)}.proof span{max-width:180px;color:#718098;font-size:12px;line-height:1.4}.proof i{width:1px;height:26px;background:var(--line)}
    .showcase{height:595px;position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;transform:translateY(-22px)}
    .showcase::selection{background:transparent}.showcase:after{content:"NUTRIÇÃO CLÍNICA";position:absolute;bottom:48px;right:40px;color:#aebed3;font-size:10px;letter-spacing:.22em;font-weight:700}
    .glow{position:absolute;width:455px;height:455px;border-radius:50%;background:radial-gradient(circle,rgba(44,135,255,.15),rgba(44,135,255,0) 70%);animation:glowPulse 4.5s ease-in-out infinite}
    .showcase > .product::before{content:"";position:absolute;inset:15% 8%;border-radius:28px;background:rgba(255,255,255,.01);z-index:-1}.product{position:absolute;cursor:pointer;transition:transform .88s cubic-bezier(.22,.61,.36,1),opacity .88s cubic-bezier(.22,.61,.36,1),filter .88s cubic-bezier(.22,.61,.36,1);filter:drop-shadow(0 18px 18px rgba(19,46,90,.12));user-select:none;background:#fff;border-radius:26px;overflow:hidden;will-change:transform,opacity}.product img{width:100%;height:100%;display:block;object-fit:contain;mix-blend-mode:multiply;background:transparent;border-radius:26px}.product.center{width:310px;height:500px;z-index:3;transform:translateY(-11px);opacity:1}.product.center img{height:370px;object-position:center top}.product.left,.product.right{width:235px;height:370px;z-index:2;opacity:.7;filter:drop-shadow(0 16px 16px rgba(19,46,90,.11)) saturate(.92)}.product.left{transform:translateX(-225px) translateY(24px) scale(.92)}.product.right{transform:translateX(225px) translateY(24px) scale(.92)}
    .product-card{position:absolute;z-index:4;bottom:16px;left:50%;right:auto;transform:translateX(-50%);width:256px;padding:17px 18px;background:rgba(255,255,255,.88);border:1px solid rgba(218,229,243,.9);box-shadow:0 18px 42px rgba(26,57,104,.12);backdrop-filter:blur(12px);border-radius:13px}.product-card .topline{display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.flavor{font:800 21px/1.15 Manrope,sans-serif;letter-spacing:-.045em;margin:7px 0 9px}.benefits{display:flex;gap:6px;flex-wrap:wrap}.benefits span{background:#eef5ff;color:#3972c2;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:700}.carousel-arrow{position:absolute;z-index:6;top:48%;width:42px;height:42px;border:1px solid rgba(204,218,238,.95);border-radius:50%;background:rgba(255,255,255,.9);color:var(--blue);font:500 27px/1 Arial,sans-serif;box-shadow:0 10px 25px rgba(25,61,111,.13);cursor:pointer;transition:transform .2s,background .2s}.carousel-arrow:hover{transform:scale(1.08);background:#fff}.carousel-arrow.prev{left:calc(50% - 199px)}.carousel-arrow.next{right:calc(50% - 199px)}
    .hero-grid>div:first-child{animation:heroEnter .7s cubic-bezier(.2,.8,.2,1) both}.product-card{animation:heroEnter .8s .14s cubic-bezier(.2,.8,.2,1) both}
    @keyframes heroEnter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes glowPulse{0%,100%{transform:scale(.94);opacity:.72}50%{transform:scale(1.08);opacity:1}}
    .pager{position:absolute;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pager button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#bdcce0;cursor:pointer;transition:.25s}.pager button.active{width:25px;border-radius:5px;background:var(--blue)}
    @media(max-width:900px){.topbar{height:76px;width:calc(100% - 40px)}nav{display:none}.menu-note{margin-left:auto}.hero-grid{width:calc(100% - 40px);grid-template-columns:1fr;text-align:center;padding:43px 0 36px}.intro{margin:22px auto 28px}.buttons,.proof{justify-content:center}.proof{margin-top:31px}.showcase{height:485px;margin-top:5px}.showcase:before{font-size:48px;top:16px;right:10px}.product.center{width:245px;height:405px}.product.left,.product.right{width:165px;height:276px}.product.left{transform:translateX(-154px) translateY(25px) scale(.86)}.product.right{transform:translateX(154px) translateY(25px) scale(.86)}.product-card{bottom:13px;width:235px;text-align:left}.product.center img{height:285px}.carousel-arrow.prev{left:calc(50% - 146px)}.carousel-arrow.next{right:calc(50% - 146px)}.showcase:after{display:none}}
    @media(max-width:520px){.topbar{width:calc(100% - 32px)}.brand{font-size:16px}.menu-note{font-size:11px}.hero-grid{width:calc(100% - 32px)}h1{font-size:42px}.showcase{height:430px}.product.center{width:215px;height:360px}.product.left,.product.right{width:132px;height:220px}.product.left{transform:translateX(-112px) translateY(20px) scale(.85)}.product.right{transform:translateX(112px) translateY(20px) scale(.85)}.product-card{bottom:10px;width:205px;padding:13px}.product.center img{height:250px}.carousel-arrow{width:37px;height:37px;top:46%}.carousel-arrow.prev{left:calc(50% - 133px)}.carousel-arrow.next{right:calc(50% - 133px)}.proof{gap:10px}}
  </style>
</head>
<body>
  <main class="hero"><div class="cursor-glow" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Santa Luzia Distribuidora"><img src="assets/santa-luzia-symbol.png" alt=""><span>Santa Luzia<small>Distribuidora</small></span></a>
      <nav aria-label="Navegação principal"><a href="#inicio">Início</a><a href="#empresa">A empresa</a><a href="#produtos">Produtos</a><a href="#contato">Contato</a></nav>
      
    </header>
    <section class="hero-grid" id="inicio">
      <div>
        <p class="eyebrow">Nutrição que transforma</p>
        <h1>Soluções que cuidam de <em>cada momento.</em></h1>
        <p class="intro">Levamos mais qualidade, confiança e nutrição para hospitais, clínicas e para quem precisa de cuidado todos os dias.</p>
        <div class="buttons"><a class="button button-primary" href="https://wa.me/5500000000000" target="_blank" rel="noopener">Fale no WhatsApp</a><a class="button button-secondary" href="#produtos">Ver nossos produtos</a></div>
        
      </div>
      <div class="showcase" id="produtos" aria-label="Carrossel de produtos EnergyZip">
        <div class="glow"></div>
        <div class="product left"><img src="" alt=""></div><div class="product center"><img src="" alt=""><div class="product-card"><div class="topline"><span>EnergyZip</span><span id="volume">200 ml</span></div><div class="flavor" id="flavor">Baunilha</div><div class="benefits" id="benefits"></div></div></div><div class="product right"><img src="" alt=""></div>
        <button class="carousel-arrow prev" type="button" aria-label="Produto anterior">‹</button><button class="carousel-arrow next" type="button" aria-label="Próximo produto">›</button>
        <div class="pager" aria-label="Escolha um produto"></div>
      </div>
    </section>
  </main>
  <script>
    const products=[
      {src:"assets/energyzip-baunilha.png",alt:"EnergyZip sabor baunilha",flavor:"Baunilha",benefits:["Vitamina C","Selênio + Zinco"]},
      {src:"assets/energyzip-proteina.png",alt:"EnergyZip proteína sabor chocolate",flavor:"Chocolate Proteína",benefits:["18g de proteína","Zero lactose"]},
      {src:"assets/energyzip-chocolate.png",alt:"EnergyZip sabor chocolate",flavor:"Chocolate",benefits:["Vitamina C","Selênio + Zinco"]},
      {src:"assets/energyzip-morango.png",alt:"EnergyZip sabor morango",flavor:"Morango",benefits:["Vitamina C","Selênio + Zinco"]}
    ];
    const header=document.querySelector(".topbar"),cursorGlow=document.querySelector(".cursor-glow");let cursorFrame;document.addEventListener("pointermove",event=>{cancelAnimationFrame(cursorFrame);cursorFrame=requestAnimationFrame(()=>{cursorGlow.style.left=event.clientX+"px";cursorGlow.style.top=event.clientY+"px";cursorGlow.classList.add("is-active")})});document.addEventListener("pointerleave",()=>cursorGlow.classList.remove("is-active"));window.addEventListener("scroll",()=>header.classList.toggle("is-hidden",window.scrollY>24),{passive:true});
    const cards=[...document.querySelectorAll(".product")],pager=document.querySelector(".pager"),flavor=document.querySelector("#flavor"),benefits=document.querySelector("#benefits"),previous=document.querySelector(".carousel-arrow.prev"),next=document.querySelector(".carousel-arrow.next");let current=0,timer;
    products.forEach((_,i)=>{const button=document.createElement("button");button.setAttribute("aria-label","Mostrar produto "+(i+1));button.onclick=()=>show(i,true);pager.append(button)});previous.onclick=()=>show(current-1,true);next.onclick=()=>show(current+1,true);
    function show(index,manual){current=(index+products.length)%products.length;[-1,0,1].forEach((offset,slot)=>{const item=products[(current+offset+products.length)%products.length],card=cards[slot];card.querySelector("img").src=item.src;card.querySelector("img").alt=item.alt;card.className="product "+["left","center","right"][slot];card.onclick=()=>show(current+offset,true)});const active=products[current];flavor.textContent=active.flavor;benefits.innerHTML=active.benefits.map(item=>"<span>"+item+"</span>").join("");[...pager.children].forEach((button,i)=>button.classList.toggle("active",i===current));cards[1].animate([{opacity:.86,transform:"translateY(-4px) scale(.985)"},{opacity:1,transform:"translateY(-11px) scale(1)"}],{duration:720,easing:"cubic-bezier(.22,.61,.36,1)"});document.querySelector(".product-card").animate([{opacity:.72,transform:"translateX(-50%) translateY(5px)"},{opacity:1,transform:"translateX(-50%) translateY(0)"}],{duration:620,easing:"cubic-bezier(.22,.61,.36,1)"});if(manual){clearInterval(timer);timer=setInterval(()=>show(current+1),4600)}}
    show(0);timer=setInterval(()=>show(current+1),4600);
  </script>
</body>
</html>
